sentence=Goertzel algorithm in float for Arduino with DTMF tone detection.
paragraph=Implements the Goertzel algorithm (K, alpha, hybrid formulations) optimized for AVR (float == 32 bits). Includes a DTMF decoder that detects all 16 keys (0-9, *, #, A-D) at 8 kHz sample rate with a 205-sample window (25.6 ms). Buffer uses 820 bytes RAM (float) or 410 bytes (int16_t variant).
